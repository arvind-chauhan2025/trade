spring.application.name=nifty-trading
server.port=8282

# Angel One SmartAPI credentials - fill these in (do not commit real secrets!)
angelone.api-key=${ANGELONE_API_KEY:****}
angelone.client-code=${ANGELONE_CLIENT_CODE:*****}
angelone.password=${ANGELONE_PASSWORD:****}
angelone.totp-secret=${ANGELONE_TOTP_SECRET:K554K5MBFAXI22I6WOUBQQLZ4U}
angelone.local-ip=${ANGELONE_LOCAL_IP:127.0.0.1}
angelone.public-ip=${ANGELONE_PUBLIC_IP:127.0.0.1}
angelone.mac-address=${ANGELONE_MAC_ADDRESS:00:00:00:00:00:00}

angelone.scrip-master-url=https://margincalculator.angelone.in/OpenAPI_File/files/OpenAPIScripMaster.json
angelone.nifty-token=26000
angelone.strike-step=50
angelone.itm-depth=${ANGELONE_ITM_DEPTH:2}
# Keep this file across restarts; use a durable absolute path in deployments.
angelone.fixed-itm-state-path=${ANGELONE_FIXED_ITM_STATE_PATH:data/fixed-itm.json}

# Local PostgreSQL database used to durably store live ticks and completed snapshots.
spring.datasource.url=jdbc:postgresql://localhost:5432/trade
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:admin}
# In-memory recent-tick history size (per label) kept for fast analysis, independent of the full H2 history.
angelone.tick-history-size=${ANGELONE_TICK_HISTORY_SIZE:500}

# Set to true to run startPipeline() once immediately at application startup,
# in addition to the normal 9:15 AM / 3:30 PM IST schedule. Useful for testing
# outside market hours; leave false (default) in production.
trading.run-on-startup=${TRADING_RUN_ON_STARTUP:true}

